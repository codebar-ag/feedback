name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        db: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: feedback_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: feedback_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      DB_DATABASE: ${{ matrix.db == 'sqlite' && ':memory:' || 'feedback_test' }}
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, gd, intl, fileinfo
          coverage: pcov
          tools: composer:v2

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: Pest with coverage
        run: ./vendor/bin/pest --coverage --min=90 --coverage-clover=coverage/clover.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.db }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
