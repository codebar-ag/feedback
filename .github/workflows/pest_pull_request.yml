name: Pull Request | CI Pest

on: pull_request

jobs:
  ci_pest:
    runs-on: ubuntu-latest
    name: pull-request | ci pest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: laravel_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PHP_VERSION: 8.5
      NODE_VERSION: 26
      # phpunit.xml defaults to in-memory SQLite; real env vars take precedence.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, fileinfo, pgsql, pdo_pgsql, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: Prepare the .env file
        run: cp .env.example .env

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache/files
            ~/.composer/cache/repo
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --no-interaction --optimize-autoloader

      - name: Publish Laravel assets
        run: php artisan vendor:publish --tag=laravel-assets --ansi --force

      - name: Setup PostgreSQL Database
        run: |
          # Database is already created by the service, just wait for it to be ready
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Generate App Key & Run Migrations
        run: |
          php artisan key:generate
          php artisan migrate:fresh

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Execute Pest Test
        run: ./vendor/bin/pest

      - name: Store Log Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Store report artifacts
          path: ./storage/logs
