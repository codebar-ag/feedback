name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium, Firefox, WebKit, Mobile) + full stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, gd, intl, fileinfo
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install widget dependencies
        working-directory: widget
        run: npm ci

      - name: Install Playwright browsers
        working-directory: widget
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build widget
        working-directory: widget
        run: npm run build

      - name: Widget E2E
        working-directory: widget
        run: npm run e2e

      - name: Full stack E2E
        working-directory: widget
        run: npm run e2e:full

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            widget/playwright-report/
            widget/test-results/
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
